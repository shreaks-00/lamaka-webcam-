<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - LAMAKA</title>
  <meta name="description" content="Sign up for LAMAKA and connect with random strangers today.">
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: var(--bg-dark, #08090d);
      display: flex;
      flex-direction: column;
    }
    
    /* Make header float on top of the layout */
    .app-header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;
      background: transparent;
      border-bottom: none;
    }
    
    .auth-page-container {
      flex: 1;
      display: flex;
      min-height: 100vh;
    }
    
    .auth-left {
      flex: 1.2;
      display: none;
      position: relative;
      background: linear-gradient(135deg, rgba(8, 9, 13, 0.7), rgba(8, 9, 13, 0.95)), url('assets/lanfing.png');
      background-size: cover;
      background-position: center;
      padding: 60px;
      flex-direction: column;
      justify-content: center;
    }
    
    @media (min-width: 900px) {
      .auth-left {
        display: flex;
      }
    }
    
    .auth-left-content {
      max-width: 500px;
      z-index: 2;
    }
    
    .auth-left h1 {
      font-family: var(--font-heading, 'Outfit', sans-serif);
      font-size: 52px;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 24px;
      background: linear-gradient(135deg, #f0e6d2, #c5a880);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .auth-left p {
      font-size: 18px;
      color: #a0a5ba;
      line-height: 1.6;
    }
    
    .auth-right {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
      background-color: var(--bg-dark, #08090d);
    }
    
    .auth-card {
      background: rgba(17, 20, 30, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(197, 168, 128, 0.15);
      border-radius: 24px;
      padding: 48px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(197, 168, 128, 0.05);
    }
    
    .ob-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    
    .ob-logo span {
      font-family: var(--font-heading, 'Outfit', sans-serif);
      font-weight: 800;
      font-size: 26px;
      background: linear-gradient(135deg, #f0e6d2, #c5a880);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .auth-title {
      text-align: center;
      color: var(--gold-primary, #c5a880);
      font-family: var(--font-heading, 'Outfit', sans-serif);
      font-size: 28px;
      margin-bottom: 8px;
      margin-top: 0;
    }
    
    .auth-tagline {
      text-align: center;
      color: var(--text-secondary, #8b92a5);
      font-size: 14px;
      margin-bottom: 32px;
    }
    
    /* Make inputs slightly larger for the bigger card */
    .form-group input, .form-group select {
      height: 44px;
    }
  </style>
  <meta name="google-site-verification" content="3_CeHzeBYpq9Q8B7JQko2BYovDz8vvmIU0aniYkECk0" />
</head>
<body>
  <!-- Header Navigation -->
  <header class="app-header">
    <div class="container header-container">
      <div class="logo">
        <a href="/" style="display:flex; align-items:center; text-decoration:none;">
          <img src="icon.png" alt="LAMAKA Logo" class="logo-svg">
          <span class="logo-text">LAMAKA</span>
        </a>
      </div>
      <nav class="nav-links">
        <a href="/" class="nav-link">Home</a>
        <a href="/login" class="btn btn-gold-filled" style="padding: 8px 18px; font-size: 12px; margin-left: 10px;">LOGIN</a>
      </nav>
    </div>
  </header>

  <div class="auth-page-container">
    
    <!-- Left Side: Hero Image & Branding -->
    <div class="auth-left">
      <div class="auth-left-content">
        <h1>Join the Global<br>Llama Herd.</h1>
        <p>Set up your profile in under 15 seconds. Experience lightning-fast, high-quality video chat with genuine people across the globe. No paywalls, no hidden tricks.</p>
      </div>
    </div>
    
    <!-- Right Side: Sign Up Form -->
    <div class="auth-right">
      <div class="auth-card" style="padding-top: 40px; padding-bottom: 40px;">
        <div class="ob-logo">
          <img src="icon.png" alt="LAMAKA" style="width:48px;height:48px;object-fit:contain;">
          <span>LAMAKA</span>
        </div>
        <h2 class="auth-title">Sign Up</h2>
        <p class="auth-tagline">New here? Let's build your profile.</p>

        <form id="onboardingForm" class="ob-form">
          <div class="form-group">
            <label for="obName">Name</label>
            <input type="text" id="obName" required placeholder="How should we call you?">
          </div>
          <div class="form-group">
            <label for="obAge">Age</label>
            <input type="number" id="obAge" required min="18" max="100" oninput="this.value = this.value.replace(/[^0-9]/g, '')" placeholder="18+ only">
          </div>
          <div class="form-group">
            <label for="obGender">Gender</label>
            <select id="obGender" required>
              <option value="" disabled selected>Select your gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="obCountry">Country</label>
            <input type="text" id="obCountry" required pattern="[a-zA-Z\s]+" title="Country name should only contain letters and spaces" oninput="this.value = this.value.replace(/[^a-zA-Z\s]/g, '')" placeholder="e.g. United States">
          </div>
          <button type="submit" class="btn btn-gold-filled ob-submit-btn" id="obSubmitBtn" style="height: 48px; font-size: 15px; margin-top: 10px;">
            <span>CREATE &amp; CHAT</span>
            <div class="spinner hidden" id="obSpinner"></div>
          </button>
        </form>
        
        <div style="text-align:center; margin-top: 24px; font-size: 14px;">
          <span style="color:var(--text-muted, #565d79);">Already have an account? </span>
          <a href="/login" style="color:var(--gold-primary, #c5a880); text-decoration:none; font-weight:600; transition: color 0.2s;" onmouseover="this.style.color='#f0e6d2'" onmouseout="this.style.color='var(--gold-primary, #c5a880)'">Login</a>
        </div>
      </div>
    </div>
    
  </div>

  <script src="app.js"></script>
</body>
</html>
